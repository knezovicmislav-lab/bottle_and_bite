name: Build Android test app

on:
  workflow_dispatch:          # lets you start a build with the "Run workflow" button
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#7A1F35' --splashBackgroundColor '#F2F3EF'

      - name: Allow the camera (for label, food and selfie photos)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Build the test app (APK)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../bottle-and-bite-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-and-bite-android-test
          path: bottle-and-bite-test.apk
          retention-days: 30

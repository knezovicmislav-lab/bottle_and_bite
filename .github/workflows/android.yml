name: Build Android test app

on:
  workflow_dispatch:          # lets you start a build with the "Run workflow" button
  push:
    paths:
      - "**/capacitor.config.json"
      - "**/android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write           # lets the build publish the app file as a download

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::Couldn't find capacitor.config.json anywhere in the repository. Upload the android-app folder first."
            exit 1
          fi
          APP_DIR=$(cd "$(dirname "$CFG")" && pwd)
          echo "Found the app in: $APP_DIR"
          ls -la "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: cd "$APP_DIR" && npm install --no-audit --no-fund

      - name: Create the Android project
        run: |
          cd "$APP_DIR"
          mkdir -p www
          [ -f www/index.html ] || echo '<!doctype html><title>Bottle &amp; Bite</title><p>Check your internet connection and reopen the app.</p>' > www/index.html
          rm -rf android
          npx cap add android

      - name: App icon and splash screen
        run: |
          cd "$APP_DIR"
          if [ -d assets ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#7A1F35' --splashBackgroundColor '#F2F3EF'
          else
            echo "No assets folder found; using the default icon."
          fi

      - name: Allow the camera (for label, food and selfie photos)
        run: |
          cd "$APP_DIR"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Build the test app (APK)
        run: |
          cd "$APP_DIR"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the file
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/bottle-and-bite-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-and-bite-android-test
          path: bottle-and-bite-test.apk
          retention-days: 30

      - name: Publish a public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Bottle & Bite – Android test app
          body: |
            Latest test build of the Bottle & Bite Android app.
            On your Android phone, tap **bottle-and-bite-test.apk** below to download and install it.
          files: bottle-and-bite-test.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
